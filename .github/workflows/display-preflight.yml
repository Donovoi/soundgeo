name: Windows display preflight
on:
  push:
    branches: [codex/release-display-preflight]
permissions:
  contents: read
  actions: read
jobs:
  display:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundgeo-windows
          run-id: 44204778664
          github-token: ${{ github.token }}
          path: preflight
      - name: Probe previously qualified desktop in runner VM
        run: python scripts/display_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-display-preflight
          path: preflight/*.log
