name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev pkg-config
      - name: Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: soundgeo-windows
          path: |
            target/release/soundgeo.exe
            target/release/soundgeo-cli.exe
