name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner images can use a separate mirror list as well as direct sources.
          # Select Ubuntu's public mirror and bound network and lock waits.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg aria2 libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1 libudev-dev libxcb-shape0 libxcb-xfixes0 pkg-config xvfb xauth xdotool
          ffmpeg -version
      - name: Restore built Windows runtime
        if: runner.os == 'Windows'
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: runtime-build/*.zip
          key: windows-runtime-v1-${{ hashFiles('scripts/build_windows_runtime.py', 'scripts/windows-runtime/**') }}
      - name: Build Windows media and OCR tools from source
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: python scripts/build_windows_runtime.py
      - name: Save built Windows runtime
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtime-build/*.zip
          key: windows-runtime-v1-${{ hashFiles('scripts/build_windows_runtime.py', 'scripts/windows-runtime/**') }}
      - name: Prepare bundled tools for Windows unit tests
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_test_tools.py
      - name: Restore built URL tools
        if: runner.os == 'Windows'
        id: url-cache
        uses: actions/cache/restore@v4
        with:
          path: url-tools-build/*.zip
          key: windows-url-tools-v1-${{ hashFiles('scripts/build_url_tools.py', 'scripts/deno_notices.py', 'docs/third-party/deno-*.json', 'docs/third-party/CC0-1.0.txt', 'scripts/url-tools-lock.json', 'scripts/audit_url_tools.py', 'scripts/pe_dependencies.py') }}
      - name: Prepare current MinGW compiler
        if: runner.os == 'Windows' && steps.url-cache.outputs.cache-hit != 'true'
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Build current URL downloaders
        if: runner.os == 'Windows' && steps.url-cache.outputs.cache-hit != 'true'
        env:
          MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: python scripts/build_url_tools.py
      - name: Save built URL tools
        if: runner.os == 'Windows' && steps.url-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: url-tools-build/*.zip
          key: windows-url-tools-v1-${{ hashFiles('scripts/build_url_tools.py', 'scripts/deno_notices.py', 'docs/third-party/deno-*.json', 'docs/third-party/CC0-1.0.txt', 'scripts/url-tools-lock.json', 'scripts/audit_url_tools.py', 'scripts/pe_dependencies.py') }}
      - name: Prepare URL tools for VM tests
        run: python scripts/prepare_url_test_tools.py
      - name: Restore built local speech tools
        id: speech-cache
        uses: actions/cache/restore@v4
        with:
          path: speech-tools-build/*.zip
          key: speech-tools-v1-${{ runner.os }}-${{ hashFiles('scripts/build_speech_tools.py', 'scripts/speech-tools-lock.json', 'scripts/speech-fonts-lock.json', 'scripts/speech-utf8.manifest', 'scripts/speech-patches/**', 'src/speech/models.json', 'docs/third-party/speech/**', 'scripts/pe_dependencies.py') }}
      - name: Build native local speech runtime
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: python scripts/build_speech_tools.py
      - name: Save built local speech tools
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: speech-tools-build/*.zip
          key: speech-tools-v1-${{ runner.os }}-${{ hashFiles('scripts/build_speech_tools.py', 'scripts/speech-tools-lock.json', 'scripts/speech-fonts-lock.json', 'scripts/speech-utf8.manifest', 'scripts/speech-patches/**', 'src/speech/models.json', 'docs/third-party/speech/**', 'scripts/pe_dependencies.py') }}
      - name: Prepare speech runtime and fonts for VM tests
        run: python scripts/prepare_speech_test_tools.py
      - run: cargo fmt --all -- --check
      - run: python -m unittest discover -s validation -p test_run_timing.py
      - run: python -m unittest discover -s scripts -p test_publish_release.py
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Rust tests and source audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release-logs
          cargo test --release --locked --all-targets 2>&1 | tee release-logs/rust-tests.log
          python scripts/audit_test_log.py release-logs/rust-tests.log
      - run: cargo test --release --locked --doc
      - run: cargo build --release --locked --bins
      - name: Package tested binaries
        run: python scripts/package_release.py
      - name: Verify extracted Linux release in virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/verify_release.py
      - name: Verify single Windows EXE with bundled dependencies
        if: runner.os == 'Windows'
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ runner.os }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*-linux-x64.zip
            dist/*-windows-runtime-sources.zip
            dist/*.sha256
            dist/validation-*.json
      - name: Preserve package-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ runner.os }}
          path: |
            release-logs/
            release-check/*.log
            release-check/*.json
            release-check/*.png
            release-check/*.mkv
            release-check/*.ps1
            release-check/speech-check/*.json
      - name: Preserve Windows runtime build logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-logs
          path: ${{ runner.temp }}/soundgeo-runtime-build/vcpkg/buildtrees/**/*.log
      - name: Preserve native speech build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-build-logs-${{ runner.os }}
          if-no-files-found: warn
          path: |
            speech-tools-build/logs/
            speech-tools-build/bundle/SPEECH-TOOLS.json
      - name: Preserve URL tool build diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: url-tool-build-logs
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/soundgeo-url-tools/**/config.log
            ${{ runner.temp }}/soundgeo-url-tools/**/*.spec
            ${{ runner.temp }}/soundgeo-url-tools/bundle/*.json
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: soundgeo-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
      - name: Publish requested version after both platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
