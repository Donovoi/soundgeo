name: Windows runtime preflight
on:
  push:
    branches: [codex/portable-windows]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_windows_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime
          path: runtime-build/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-build-logs
          path: ${{ runner.temp }}/soundgeo-runtime-build/vcpkg/buildtrees/**/*.log
