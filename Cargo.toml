[package]
name = "soundgeo"
version = "0.3.0-dev.1"
edition = "2024"
description = "Local aircraft-Doppler geolocation workbench"
rust-version = "1.88"
default-run = "soundgeo"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1.4"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
flate2 = "1"
hound = "3.5"
quick-xml = { version = "0.41", features = ["serialize"] }
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.15"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tar = "0.4"
tempfile = "3"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
