[package]
name = "soundgeo"
version = "0.4.0-alpha.4"
edition = "2024"
description = "Local aircraft-Doppler geolocation workbench"
rust-version = "1.89"
default-run = "soundgeo"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
csv = "1.4"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
flate2 = "1"
futures-util = "0.3"
hound = "3.5"
hmac = "0.12"
quick-xml = { version = "0.41", features = ["serialize"] }
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.15"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tar = "0.4"
tempfile = "3"
walkdir = "2"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
